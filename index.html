<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2A4A">
<meta name="description" content="สมุดดูแลรถมอเตอร์ไซค์ บันทึกน้ำมัน รอบเปลี่ยนอะไหล่ ประวัติซ่อม และวันต่อ พ.ร.บ./ภาษี">
<title>สมุดดูแลรถ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E2A4A;--navy2:#2C3C66;--amber:#FFB020;--amber-soft:#FFF3DA;
  --bg:#F3F4F8;--card:#fff;--text:#1B2236;--muted:#6B7387;--line:#E4E7EF;
  --red:#E5484D;--red-soft:#FDECEC;--orange:#E58A00;--orange-soft:#FFF2DC;--green:#2BA471;--green-soft:#E3F5EC;
  --r:16px;--shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1424;--card:#192036;--text:#EEF1F8;--muted:#98A1B8;--line:#2A3350;
    --amber-soft:#3A2F14;--red-soft:#3B1C22;--orange-soft:#3A2A10;--green-soft:#123326;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}.ic.lg{width:28px;height:28px}

header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 18px;position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:12px}
header .ttl{flex:1;min-width:0}
header h1{font-size:18px;margin:0;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;opacity:.7;font-size:12.5px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{margin-left:auto;background:rgba(255,255,255,.1);border:0;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;color:#fff;cursor:pointer}
.hbtn.sync.ok{color:#5BE3A0}.hbtn.sync.syncing{color:var(--amber)}.hbtn.sync.err,.hbtn.sync.offline{color:#FF8A8F}.hbtn.sync.off{color:rgba(255,255,255,.55)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--amber);color:var(--navy);display:grid;place-items:center}

main{padding-top:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;font-weight:600}
.card h2 .act{margin-left:auto}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.stat b{display:block;font-size:22px;font-weight:700;line-height:1.3}
.stat span{font-size:12.5px;color:var(--muted)}

.odo{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}
.odo .big{font-size:34px;font-weight:700;letter-spacing:.5px;line-height:1.1}
.odo .muted{color:rgba(255,255,255,.7)}

.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--bg);color:var(--text)}
.btn.primary{background:var(--navy);color:#fff}
.btn.amber{background:var(--amber);color:var(--navy)}
.btn.ghost{background:transparent;color:var(--navy);padding:6px 8px}
@media (prefers-color-scheme:dark){.btn.ghost{color:var(--amber)}.btn.primary{background:var(--amber);color:var(--navy)}}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.quick .btn{padding:14px;border-radius:var(--r);box-shadow:var(--shadow);background:var(--card)}
.quick .btn .tile{width:34px;height:34px}

.tile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--amber-soft);color:var(--navy);flex:none}
@media (prefers-color-scheme:dark){.tile{color:var(--amber)}}
.tile.over{background:var(--red-soft);color:var(--red)}
.tile.soon{background:var(--orange-soft);color:var(--orange)}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0}
.item .t{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{display:block;font-size:12.5px;color:var(--muted)}
.item .r{text-align:right;flex:none}
.item .r b{display:block}

.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--green)}
.bar i.soon{background:var(--orange)}.bar i.over{background:var(--red)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.badge.soon{background:var(--orange-soft);color:var(--orange)}
.badge.over{background:var(--red-soft);color:var(--red)}
.badge.gray{background:var(--bg);color:var(--muted)}

.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .tile{margin:0 auto 10px;width:52px;height:52px}
.hint{background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:8px}
.docbtns{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding-left:54px}.docbtns .btn{white-space:nowrap;padding:7px 10px}
.month{font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 2px}

.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.chart .stack{flex:1;width:100%;max-width:34px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:8px;overflow:hidden}
.chart .stack i{display:block;width:100%}
.chart .fb{background:var(--amber)}.chart .ob{background:var(--navy2)}
@media (prefers-color-scheme:dark){.chart .ob{background:#5C77C2}}
.chart label{font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
nav button{background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer}
nav button.on{color:var(--navy);font-weight:600}
@media (prefers-color-scheme:dark){nav button.on{color:var(--amber)}}
nav button.on .ic{stroke-width:2.2}

dialog{border:0;padding:0;width:100%;max-width:560px;max-height:92vh;margin:auto auto 0;border-radius:20px 20px 0 0;background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(10,15,30,.45)}
dialog form{display:flex;flex-direction:column;max-height:92vh}
.sh-head{display:flex;align-items:center;padding:16px 16px 8px}
.sh-head h3{margin:0;font-size:17px}
.sh-head .x{margin-left:auto;background:var(--bg);border:0;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.sh-body{padding:4px 16px 8px;overflow:auto}
.sh-foot{display:flex;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sh-foot .btn{flex:1}.sh-foot .btn.danger{flex:0 0 52px}a.btn{text-decoration:none}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--amber)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1.5px solid var(--line);border-radius:20px;font-size:13px;cursor:pointer}
.f .chips input{width:auto;padding:0;margin:0;accent-color:var(--navy)}
.chips label{margin:0;color:var(--text)}
.chips label:has(input:checked){border-color:var(--amber);background:var(--amber-soft)}
.pw{position:relative}.f .pw input{padding-right:46px}.pw .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;width:38px;height:38px;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.calc{font-size:13px;color:var(--muted);margin:-4px 0 10px}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.credit{text-align:center;font-size:11.5px;color:var(--muted);padding:6px 0 14px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo" id="logo"></div>
    <div class="ttl"><h1 id="bikeName">สมุดดูแลรถ</h1><small id="bikeSub"></small></div>
    <button class="hbtn sync" data-act="syncTap" aria-label="สถานะซิงก์" id="syncBtn" style="margin-left:0;flex:none"></button>
    <button class="hbtn" data-act="settings" aria-label="ตั้งค่า" id="setBtn" style="margin-left:0;flex:none"></button>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav><div class="wrap" id="tabs"></div></nav>

<dialog id="sheet">
  <form id="sheetForm" method="dialog" novalidate>
    <div class="sh-head"><h3 id="sheetTitle"></h3><button type="button" class="x" data-act="close" aria-label="ปิด" id="xBtn"></button></div>
    <div class="sh-body" id="sheetBody"></div>
    <div class="sh-foot" id="sheetFoot"></div>
  </form>
</dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast"></div>

<script>
/* ---------- ไอคอน (เส้น 24px) ---------- */
const ICONS={
  home:"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",
  fuel:"M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M4 10h10M14 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3",
  wrench:"M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z",
  history:"M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2",
  doc:"M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M9 13h6M9 17h4",
  settings:"M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z",
  plus:"M12 5v14M5 12h14",
  x:"M6 6l12 12M18 6 6 18",
  oil:"M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11zM9.5 15a2.5 2.5 0 0 0 2.5 2.5",
  drop:"M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z",
  gear:"M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1",
  filter:"M3 5h18l-7 8v6l-4 2v-8z",
  spark:"M13 2 4 14h7l-1 8 9-12h-7z",
  belt:"M7 7a5 5 0 1 0 0 10h10a5 5 0 1 0 0-10zM7 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM17 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4z",
  clutch:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7.5v.01M7.5 14v.01M16.5 14v.01M12 12v.01",
  coolant:"M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0zM12 10v7",
  brake:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2",
  tire:"M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM12 2v5M12 17v5M2 12h5M17 12h5",
  battery:"M3 7h15a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zM22 10v4M6 12h4M8 10v4M13 12h3",
  clean:"M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6",
  shield:"M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6zM9 12l2 2 4-4",
  id:"M3 5h18v14H3zM7 10a2 2 0 1 0 4 0 2 2 0 0 0-4 0M6 16c.5-1.5 2-2 3-2s2.5.5 3 2M14 9h4M14 13h4",
  receipt:"M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4",
  calendar:"M4 5h16v16H4zM4 10h16M8 3v4M16 3v4",
  gauge:"M3.5 18a9 9 0 1 1 17 0M12 14l4-5M12 14v.01",
  bell:"M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0",
  download:"M12 3v12M7 10l5 5 5-5M4 21h16",
  upload:"M12 15V3M7 8l5-5 5 5M4 21h16",
  check:"M5 12l5 5 9-10",
  trash:"M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14",
  alert:"M12 3 2 20h20zM12 10v4M12 17v.01",
  chart:"M4 20V10M10 20V4M16 20v-7M3 20h18",
  bike:"M5 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM5 14h4l3-5h4l3 5M12 9 10 5H7M15 5h3",
  cloud:"M7 18a4.5 4.5 0 1 1 .9-8.9A6 6 0 0 1 19 11a3.5 3.5 0 0 1-.5 7z",
  cloudOff:"M7 18a4.5 4.5 0 1 1 .9-8.9A6 6 0 0 1 19 11a3.5 3.5 0 0 1-.5 7zM3 3l18 18",
  logout:"M15 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-4M10 17l-5-5 5-5M5 12h11",
  eye:"M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z",
  eyeOff:"M2 12s3.5-7 10-7c2 0 3.7.6 5.1 1.5M22 12s-3.5 7-10 7c-2 0-3.7-.6-5.1-1.5M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18",
  install:"M12 3v10M8 9l4 4 4-4M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"
};
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]||ICONS.wrench}"/></svg>`;

/* ---------- วันที่และตัวเลข ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addMonths=(s,m)=>{const d=parseD(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const fmtDate=s=>s?parseD(s).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'-';
const fmtMonth=k=>parseD(k+'-01').toLocaleDateString('th-TH',{month:'short',year:'2-digit'});
const num=(n,d=0)=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);

/* ---------- ข้อมูล ---------- */
const KEY='bikelog-v1';
// ค่าเริ่มต้นสำหรับสกู๊ตเตอร์ 150cc ระบายความร้อนด้วยน้ำ (GPX Drone 150 4V) — แก้ได้ทุกค่าในแอพ
const DEFAULT_ITEMS=[
  ['oil','น้ำมันเครื่อง',3000,3,'ทุก 3,000 กม. หรือ 3 เดือน แล้วแต่อะไรถึงก่อน'],
  ['gear','น้ำมันเฟืองท้าย',6000,12,'โดยทั่วไปเปลี่ยนทุก 2 รอบน้ำมันเครื่อง'],
  ['filter','ไส้กรองอากาศ',10000,12,'ถ้าวิ่งที่ฝุ่นเยอะ ควรเช็กถี่ขึ้น'],
  ['spark','หัวเทียน',10000,12,''],
  ['belt','สายพานขับ',20000,24,'ควรตรวจรอยร้าวตั้งแต่ราว 10,000 กม.'],
  ['clutch','เม็ดตุ้ม / ชุดคลัตช์',20000,24,'ตรวจพร้อมสายพาน'],
  ['coolant','น้ำยาหม้อน้ำ',20000,24,'เช็กระดับในกระป๋องพักทุกเดือน'],
  ['brake','ผ้าเบรก (ตรวจหน้า/หลัง)',6000,6,''],
  ['drop','น้ำมันเบรก',0,24,''],
  ['tire','ยางหน้า',20000,36,'เช็กลมยางทุกสัปดาห์'],

const curOdo=()=>Math.max(+S.bike.odo||0,...S.fuel.map(f=>+f.odo||0),...S.logs.map(l=>+l.odo||0));

/* ---------- คำนวณสถานะ ---------- */
function itemStatus(it){
  const odo=curOdo(),t=today();
  let kmLeft=null,daysLeft=null,due=null,p1=0,p2=0;
  if(+it.km>0){kmLeft=(+it.lastKm)+(+it.km)-odo;p1=(odo-it.lastKm)/it.km}
  if(+it.months>0&&it.lastDate){due=addMonths(it.lastDate,+it.months);daysLeft=diffDays(t,due);const span=diffDays(it.lastDate,due)||1;p2=diffDays(it.lastDate,t)/span}
  const over=(kmLeft!==null&&kmLeft<=0)||(daysLeft!==null&&daysLeft<=0);
  const soon=!over&&((kmLeft!==null&&kmLeft<=S.settings.warnKm)||(daysLeft!==null&&daysLeft<=S.settings.warnDays));
  const level=over?'over':soon?'soon':'ok';
  let text;
  if(over){
    const parts=[];
    if(kmLeft!==null&&kmLeft<=0)parts.push(`เกิน ${num(-kmLeft)} กม.`);
    if(daysLeft!==null&&daysLeft<=0)parts.push(daysLeft===0?'ครบกำหนดวันนี้':`เกิน ${num(-daysLeft)} วัน`);
    text=parts.join(' · ');
  }else{
    const parts=[];
    if(kmLeft!==null)parts.push(`อีก ${num(kmLeft)} กม.`);
    if(daysLeft!==null)parts.push(daysLeft>60?`ถึง ${fmtDate(due)}`:`อีก ${daysLeft} วัน`);
    text=parts.join(' · ');
  }
  return{kmLeft,daysLeft,due,pct:Math.max(0,Math.min(1,Math.max(p1,p2))),level,text};
}
function docStatus(d){
  if(!d.expiry)return{level:'none',text:'ยังไม่ได้ตั้งวันหมดอายุ',days:null};
  const days=diffDays(today(),d.expiry);
  if(days<0)return{level:'over',text:`หมดอายุแล้ว ${num(-days)} วัน`,days};
  if(days===0)return{level:'over',text:'หมดอายุวันนี้',days};
  if(days<=S.settings.docDays)return{level:'soon',text:`อีก ${days} วัน`,days};
  return{level:'ok',text:`อีก ${num(days)} วัน`,days};
}
function alerts(){
  const a=[];
  S.items.forEach(it=>{const s=itemStatus(it);if(s.level!=='ok')a.push({kind:'item',id:it.id,icon:it.icon,name:it.name,level:s.level,text:s.text,w:s.level==='over'?0:1})});
  S.docs.forEach(d=>{const s=docStatus(d);if(s.level==='over'||s.level==='soon')a.push({kind:'doc',id:d.id,icon:d.icon,name:d.name,level:s.level,text:s.text,w:s.level==='over'?0:1})});
  return a.sort((x,y)=>x.w-y.w);
}
function fuelStats(){
  const list=[...S.fuel].sort((a,b)=>a.odo-b.odo||a.date.localeCompare(b.date));
  const per={};let lastFull=null,acc=0,accCost=0,totKm=0,totL=0,totCost=0,last=null;
  list.forEach(f=>{
    if(lastFull===null){if(f.full){lastFull=+f.odo;acc=0;accCost=0}return}
    acc+=+f.liters;accCost+=+f.price;
    if(f.full){
      const km=f.odo-lastFull;
      if(km>0&&acc>0){per[f.id]=km/acc;totKm+=km;totL+=acc;totCost+=accCost;last=km/acc}
      lastFull=+f.odo;acc=0;accCost=0;
    }
  });
  return{per,avg:totL?totKm/totL:null,last,bpk:totKm?totCost/totKm:null};
}
const monthKey=s=>s.slice(0,7);
function monthTotals(n=6){
  const keys=[];const d=new Date();d.setDate(1);
  for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);keys.push(iso(x).slice(0,7))}
  const m=Object.fromEntries(keys.map(k=>[k,{fuel:0,other:0}]));
  S.fuel.forEach(f=>{const k=monthKey(f.date);if(m[k])m[k].fuel+=+f.price||0});
  S.logs.forEach(l=>{const k=monthKey(l.date);if(m[k])m[k].other+=+l.cost||0});
  return keys.map(k=>({k,...m[k]}));
}

const dlg=$('#sheet');let onSubmit=null,sheetGen=0;
function openSheet(title,body,fn,{submit='บันทึก',extra=''}={}){
  $('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=body;
  $('#sheetFoot').innerHTML=extra+(fn?`<button class="btn primary" type="submit">${submit}</button>`:'');
  onSubmit=fn;sheetGen++;if(!dlg.open)dlg.showModal();
  $('#sheetBody').scrollTop=0;

$('#sheetForm').addEventListener('submit',async e=>{
  e.preventDefault();if(!onSubmit)return dlg.close();
  const form=e.target;if(!form.checkValidity()){form.reportValidity();return}
  const btn=form.querySelector('[type=submit]');if(btn)btn.disabled=true;
  const gen=sheetGen;
  let r;try{r=await onSubmit(new FormData(form))}finally{if(btn)btn.disabled=false}
  if(r===false)return;
  if(gen===sheetGen)dlg.close(); // ถ้ามีฟอร์มอื่นเปิดแทนระหว่างรอ อย่าปิดทับ
  if(r!=='nosave')save();render();

function snapshot(){
  if(!('caches' in window))return;
  const s={warnKm:S.settings.warnKm,warnDays:S.settings.warnDays,docDays:S.settings.docDays,
    dated:S.items.filter(i=>+i.months>0).map(i=>({name:i.name,due:addMonths(i.lastDate,+i.months)})),
    km:S.items.filter(i=>+i.km>0).map(i=>({name:i.name,left:(+i.lastKm)+(+i.km)-curOdo()})),
    docs:S.docs.filter(d=>d.expiry).map(d=>({name:d.name,due:d.expiry}))};
  caches.open('bikelog-data').then(c=>c.put('due.json',new Response(JSON.stringify(s),{headers:{'Content-Type':'application/json'}}))).catch(()=>{});
}
async function showDue(force){
  if(!('Notification' in window)||Notification.permission!=='granted'||!('serviceWorker' in navigator))return false;
  const t=today();if(!force&&S.settings.notifiedOn===t)return false;
  const a=alerts();
  const reg=await navigator.serviceWorker.ready;
  if(!a.length){if(force)reg.showNotification('สมุดดูแลรถ',{body:'การแจ้งเตือนทำงานแล้ว ตอนนี้ยังไม่มีรายการที่ถึงรอบ',icon:'icon-192.png',badge:'badge-96.png',tag:'due'});return true}
  reg.showNotification(`มี ${a.length} รายการต้องดูแล`,{body:a.slice(0,5).map(x=>`• ${x.name}: ${x.text}`).join('\n'),icon:'icon-192.png',badge:'badge-96.png',tag:'due'});
  S.settings.notifiedOn=t;persist();caches.open('bikelog-data').then(c=>c.put('notified-on',new Response(t))).catch(()=>{});return true;
}
async function enableNotif(){
  if(!('Notification' in window))return toast('อุปกรณ์นี้ไม่รองรับการแจ้งเตือน');
  const p=await Notification.requestPermission();
  if(p!=='granted')return toast('ยังไม่ได้อนุญาตการแจ้งเตือน');
  try{const reg=await navigator.serviceWorker.ready;
    if('periodicSync' in reg){const st=await navigator.permissions.query({name:'periodic-background-sync'});if(st.state==='granted')await reg.periodicSync.register('due-check',{minInterval:12*3600*1000})}
  }catch(e){}
  await showDue(true);toast('เปิดการแจ้งเตือนแล้ว');if(dlg.open)dlg.close();render();
}

/* ---------- Supabase sync ---------- */
const SUPA_URL='https://nzpxhocejalvbvtwttww.supabase.co';
const SUPA_KEY='sb_publishable_XpK-uyHd7raqQ2uWf9ixNw_GULw9fIS'; // publishable key: ใช้ในเบราว์เซอร์ได้ ข้อมูลป้องกันด้วย RLS
const TABLE='bikelog_state';
let sb=null,user=null,syncState='off',pushT=null;
const SYNC_TXT={ok:'ซิงก์แล้ว',syncing:'กำลังซิงก์...',offline:'ออฟไลน์ (จะซิงก์เมื่อมีเน็ต)',err:'ซิงก์ไม่สำเร็จ แตะเพื่อลองใหม่',off:'ไม่ได้เชื่อมคลาวด์'};
function setSync(st){syncState=st;const b=$('#syncBtn');if(!b)return;b.className='hbtn sync '+st;b.innerHTML=ic(st==='ok'||st==='syncing'?'cloud':'cloudOff');b.title=SYNC_TXT[st]}
async function initCloud(){
  const isRecovery=/type=recovery/.test(location.hash);
  try{
    const m=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    sb=m.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit',storageKey:'bikelog-auth'}});
  }catch(e){setSync('offline');return afterAuth()}
  const {data:{session}}=await sb.auth.getSession();
  user=session?.user||null;
  sb.auth.onAuthStateChange((ev,s)=>{const u=s?.user||null;if(u&&!user){user=u;setTimeout(()=>pull().then(()=>{render();afterAuth()}),0)}else user=u;if(!u)setSync('off')});
  if(!user){
    if(/error_code=otp_expired|error=access_denied/.test(location.hash)){history.replaceState(null,'',location.pathname);loginForm('reset');return authMsg('ลิงก์หมดอายุหรือถูกใช้ไปแล้ว ขอลิงก์ใหม่ได้ที่นี่')}
    if(!navigator.onLine)return afterAuth();return loginForm()}
  if(isRecovery)return newPassForm();
  await pull();render();afterAuth();
}
async function pull(){
  if(!sb||!user)return setSync('off');
  if(!navigator.onLine)return setSync('offline');
  setSync('syncing');
  const {data,error}=await sb.from(TABLE).select('data,updated_at').eq('user_id',user.id).maybeSingle();
  if(error){console.warn(error);return setSync('err')}
  const remoteT=data?Date.parse(data.updated_at):0,localT=S.updatedAt||0;
  const localIsOther=S.owner&&S.owner!==user.id;
  if(data&&(remoteT>localT||!S.setup||localIsOther)){
    const keep=S.settings&&S.settings.notifiedOn;
    S=Object.assign(fresh(),data.data,{dirty:false,owner:user.id,updatedAt:remoteT});
    S.settings=Object.assign(fresh().settings,S.settings,{notifiedOn:keep||''});
    persist();snapshot();render();return setSync('ok');
  }
  if(localIsOther){S=fresh();persist();render();return setSync('ok')}
  if(S.setup&&(!data||localT>remoteT||S.dirty))return push();
  setSync('ok');
}
function schedulePush(){if(!user)return;clearTimeout(pushT);pushT=setTimeout(push,1200)}
async function push(){
  if(!sb||!user)return;
  if(!navigator.onLine)return setSync('offline');
  setSync('syncing');
  S.owner=user.id;
  const {dirty,...payload}=S;
  const {error}=await sb.from(TABLE).upsert({user_id:user.id,data:payload,updated_at:new Date(S.updatedAt||Date.now()).toISOString()});
  if(error){console.warn(error);return setSync('err')}
  S.dirty=false;persist();setSync('ok');
}
const AUTH_ERR={'New password should be different from the old password.':'รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสเดิม','Password should be at least 6 characters.':'รหัสผ่านต้องมีอย่างน้อย 6 ตัว','For security purposes, you can only request this after 60 seconds.':'ขอได้อีกครั้งหลัง 1 นาที','Email rate limit exceeded':'ส่งอีเมลบ่อยเกินไป รอสักครู่แล้วลองใหม่','email rate limit exceeded':'ส่งอีเมลบ่อยเกินไป รอสักครู่แล้วลองใหม่','Invalid login credentials':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','Email not confirmed':'ยังไม่ได้ยืนยันอีเมล ให้กดลิงก์ในอีเมลก่อน','User already registered':'อีเมลนี้สมัครแล้ว ให้เข้าสู่ระบบแทน'};
const pwField=(name,label,ac)=>`<div class="f"><label>${label}</label><div class="pw"><input name="${name}" type="password" required minlength="6" autocomplete="${ac}" autocapitalize="off" autocorrect="off" spellcheck="false"><button type="button" class="eye" data-act="togglePw" aria-label="แสดงรหัสผ่าน">${ic('eye','sm')}</button></div></div>`;
const authMsg=(t,c='red')=>{const m=$('#authMsg');if(m){m.style.color=`var(--${c})`;m.textContent=t}};
const authRedirect=()=>location.origin+location.pathname;
function afterLogin(){toast('เข้าสู่ระบบแล้ว');setTimeout(()=>{if(started&&!S.setup&&!dlg.open)setupForm();else afterAuth()},60)}
function loginForm(mode='in',email=''){
  const up=mode==='up',reset=mode==='reset';
  const title=up?'สมัครบัญชี':reset?'ลืมรหัสผ่าน':'เข้าสู่ระบบ';
  openSheet(title,
    `${reset?`<div class="hint">${ic('bell','sm')}<div>ใส่อีเมลที่ใช้สมัคร ระบบจะส่งลิงก์ไปให้ตั้งรหัสผ่านใหม่ กดลิงก์จากมือถือเครื่องนี้ได้เลย</div></div>`
      :`<div class="hint">${ic('cloud','sm')}<div>ข้อมูลจะซิงก์เก็บบนคลาวด์ (Supabase) เปลี่ยนมือถือหรือล้างแอพ ข้อมูลก็ไม่หาย และเปิดดูได้หลายเครื่อง</div></div>`}
     ${fld('อีเมล',inp('email',email,'type="email" required autocomplete="email" inputmode="email" autocapitalize="off"'))}
     ${reset?'':pwField('password','รหัสผ่าน'+(up?' (อย่างน้อย 6 ตัว)':''),up?'new-password':'current-password')}
     ${up?pwField('password2','พิมพ์รหัสผ่านอีกครั้ง','new-password'):''}
     <div class="calc" id="authMsg"></div>
     ${mode==='in'?`<button type="button" class="btn ghost block" data-act="toReset">ลืมรหัสผ่าน?</button>`:''}
     <button type="button" class="btn ghost block" data-act="${up||reset?'toSignin':'toSignup'}">${up||reset?'กลับไปหน้าเข้าสู่ระบบ':'ยังไม่มีบัญชี? สมัครใหม่'}</button>
     <button type="button" class="btn ghost block" data-act="skipLogin" style="color:var(--muted)">ใช้แบบออฟไลน์ไปก่อน</button>`,
    async fd=>{
      if(!sb){authMsg('เชื่อมต่อคลาวด์ไม่ได้ ตรวจสอบอินเทอร์เน็ต');return false}
      const em=fd.get('email').trim().toLowerCase(),password=fd.get('password');
      if(up&&password!==fd.get('password2')){authMsg('รหัสผ่านสองช่องไม่ตรงกัน');return false}
      authMsg('กำลังดำเนินการ...','muted');
      if(reset){
        const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:authRedirect()});
        if(error){authMsg(AUTH_ERR[error.message]||error.message);return false}
        authMsg('ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่อีเมลแล้ว (ถ้าไม่เห็นให้ดูในจดหมายขยะ)','green');return false;
      }
      const res=up?await sb.auth.signUp({email:em,password,options:{emailRedirectTo:authRedirect()}}):await sb.auth.signInWithPassword({email:em,password});
      if(res.error){
        const m=res.error.message;
        if(m==='Email not confirmed'){
          await sb.auth.resend({type:'signup',email:em,options:{emailRedirectTo:authRedirect()}});
          authMsg('ยังไม่ได้ยืนยันอีเมล ส่งลิงก์ยืนยันให้ใหม่แล้ว กดลิงก์ในอีเมลก่อน');return false;
        }
        authMsg(m==='Invalid login credentials'?'อีเมลหรือรหัสผ่านไม่ถูกต้อง ลองกดรูปตาเพื่อดูรหัสที่พิมพ์ หรือกด "ลืมรหัสผ่าน?" เพื่อตั้งใหม่':(AUTH_ERR[m]||m));return false;
      }
      if(up&&!res.data.session){authMsg('ส่งลิงก์ยืนยันไปที่อีเมลแล้ว กดลิงก์ในอีเมล แล้วแอพจะเข้าสู่ระบบให้','green');return false}
      user=res.data.user;await pull();afterLogin();return 'nosave';
    },{submit:up?'สมัคร':reset?'ส่งลิงก์':'เข้าสู่ระบบ'});
  dlg.dataset.login='1';
}
function newPassForm(){
  openSheet('ตั้งรหัสผ่านใหม่',
    `<div class="hint">${ic('check','sm')}<div>ยืนยันตัวตนแล้ว ตั้งรหัสผ่านใหม่สำหรับ ${esc(user?.email||'')}</div></div>
     ${pwField('password','รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)','new-password')}
     ${pwField('password2','พิมพ์รหัสผ่านใหม่อีกครั้ง','new-password')}
     <div class="calc" id="authMsg"></div>`,
    async fd=>{
      const password=fd.get('password');
      if(password!==fd.get('password2')){authMsg('รหัสผ่านสองช่องไม่ตรงกัน');return false}
      authMsg('กำลังบันทึก...','muted');
      const {error}=await sb.auth.updateUser({password});
      if(error){authMsg(AUTH_ERR[error.message]||error.message);return false}
      await pull();toast('ตั้งรหัสผ่านใหม่แล้ว');setTimeout(()=>{if(started&&!S.setup&&!dlg.open)setupForm();else afterAuth()},60);return 'nosave';
    },{submit:'บันทึกรหัสผ่าน'});
}

/* ---------- Start ---------- */
$('#logo').innerHTML=ic('bike');$('#setBtn').innerHTML=ic('settings');$('#xBtn').innerHTML=ic('x','sm');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
const qa=new URLSearchParams(location.search).get('a');
if(qa)history.replaceState(null,'',location.pathname+location.hash);
let started=false;
function afterAuth(){
  if(started)return;started=true;
  if(!S.setup)return setupForm();
  showDue(false);if(qa==='fuel')fuelForm();else if(qa==='log')logForm();
}
render();snapshot();setSync('off');initCloud();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();showDue(false);if(user)(S.dirty?push():pull())}});
window.addEventListener('online',()=>{if(user)(S.dirty?push():pull())});
window.addEventListener('offline',()=>{if(user)setSync('offline')});
</script>
